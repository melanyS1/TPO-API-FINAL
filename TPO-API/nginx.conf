server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Serve static files and enable SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Basic gzip for text assets
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/rss+xml text/javascript image/svg+xml;
  gzip_min_length 256;
}